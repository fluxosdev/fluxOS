# The boot menu of a disk fluxOS is installed on (fluxinstall copies it
# to /boot/grub/grub.cfg there; the CD has its own, install.cfg). The
# system runs from the disk: the kernel mounts the FAT32 volume with this
# serial number as / and no initrd is loaded.
set timeout=3
set default=0

insmod all_video
insmod probe

set rootarg=
probe --set=bootuuid --fs-uuid $root
if [ -n "$bootuuid" ]; then
    set rootarg="root=UUID=$bootuuid"
fi

# Display settings. fluxos_gfx is the mode GRUB asks the BIOS for;
# fluxos_video, when set, is a mode for a 3dfx card's own driver (video=
# on the kernel command line). Display Properties saves both in grubenv;
# by default the BIOS mode stays.
set fluxos_gfx=1024x768x32
set fluxos_video=
if [ -s $prefix/grubenv ]; then
    insmod loadenv
    load_env fluxos_gfx fluxos_video
fi
export rootarg fluxos_gfx fluxos_video

if [ -z "$rootarg" ]; then
    menuentry "fluxOS cannot find its partition" {
        echo "GRUB cannot read the serial number of the fluxOS partition, so the"
        echo "kernel would not know which volume to start from. Start the computer"
        echo "from the fluxOS CD and install fluxOS again."
        sleep 60
    }
fi

menuentry "fluxOS" {
    multiboot /boot/fluxos.kernel bootfs=fat $rootarg video=$fluxos_video
    set gfxpayload=$fluxos_gfx,1024x768,auto
    boot
}

# The boot messages instead of the startup screen.
menuentry "fluxOS (show boot messages)" {
    multiboot /boot/fluxos.kernel bootfs=fat $rootarg video=$fluxos_video nosplash
    set gfxpayload=$fluxos_gfx,1024x768,auto
    boot
}

menuentry "fluxOS (text console)" {
    multiboot /boot/fluxos.kernel bootfs=fat $rootarg
    set gfxpayload=text
    boot
}

# Safe mode, for when a driver or a display setting stops fluxOS from
# starting: one processor, the BIOS's display mode without a card's own
# driver, no write-combining, and the boot messages shown.
menuentry "fluxOS (safe mode)" {
    multiboot /boot/fluxos.kernel bootfs=fat $rootarg nosmp radeon=off voodoo=off pat=off nosplash
    set gfxpayload=1024x768,auto
    boot
}
