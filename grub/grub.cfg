set timeout=3
set default=0

insmod all_video
insmod probe

# Tell the kernel which filesystem it was started from: iso9660 on the
# CD (or a USB stick written from the ISO), fat on an installed disk.
probe --set=bootfs --fs $root

# On an installed disk the system runs from the disk itself: the kernel
# mounts the volume with this serial number as / and no initrd is loaded.
# Safe mode runs from the initrd in memory instead, as the CD does.
set rootarg=
if [ "$bootfs" = "fat" ]; then
    probe --set=bootuuid --fs-uuid $root
    if [ -n "$bootuuid" ]; then
        set rootarg="root=UUID=$bootuuid"
    fi
fi

# Display settings. fluxos_gfx is the mode GRUB asks the BIOS for;
# fluxos_video, when set, is a mode for a 3dfx card's own driver (video=
# on the kernel command line). Display Properties saves both in grubenv
# on an installed disk; by default the BIOS mode stays.
set fluxos_gfx=1024x768x32
set fluxos_video=
if [ -s $prefix/grubenv ]; then
    insmod loadenv
    load_env fluxos_gfx fluxos_video
fi
export bootfs rootarg fluxos_gfx fluxos_video

menuentry "fluxOS" {
    if [ -n "$rootarg" ]; then
        multiboot /boot/fluxos.kernel bootfs=$bootfs $rootarg video=$fluxos_video
    else
        multiboot /boot/fluxos.kernel bootfs=$bootfs video=$fluxos_video
        module /boot/initrd.tar initrd
    fi
    set gfxpayload=$fluxos_gfx,1024x768,auto
    boot
}

menuentry "fluxOS (text console)" {
    if [ -n "$rootarg" ]; then
        multiboot /boot/fluxos.kernel bootfs=$bootfs $rootarg
    else
        multiboot /boot/fluxos.kernel bootfs=$bootfs
        module /boot/initrd.tar initrd
    fi
    set gfxpayload=text
    boot
}

if [ -n "$rootarg" ]; then
    menuentry "fluxOS (safe mode: run from memory)" {
        multiboot /boot/fluxos.kernel bootfs=$bootfs video=$fluxos_video
        module /boot/initrd.tar initrd
        set gfxpayload=$fluxos_gfx,1024x768,auto
        boot
    }
fi
