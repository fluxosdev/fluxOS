set timeout=3
set default=0

insmod all_video

menuentry "fluxOS" {
    multiboot /boot/fluxos.kernel
    module /boot/initrd.tar initrd
    set gfxpayload=1024x768x32,1024x768,auto
    boot
}

menuentry "fluxOS (text console)" {
    multiboot /boot/fluxos.kernel
    module /boot/initrd.tar initrd
    set gfxpayload=text
    boot
}
