# The install CD's menu. It starts fluxOS Setup: the kernel with a small
# setup system in memory (setup.tar), which installs the system on the CD
# (system.tar) onto a hard disk. The installed disk has its own menu
# (grub.cfg), which fluxinstall copies there.
set timeout=5
set default=setup

insmod all_video
insmod part_msdos
insmod fat

# A hard disk that has fluxOS already starts by default, as a Windows CD
# leaves the disk to start when no key is pressed: the CD may well still
# be in the drive when Setup restarts the computer.
if [ -f (hd0,msdos1)/boot/fluxos.kernel ]; then
    if [ -f (hd0,msdos1)/boot/grub/grub.cfg ]; then
        set default=harddisk
    fi
fi

menuentry "Install fluxOS" --id setup {
    multiboot /boot/fluxos.kernel bootfs=iso9660
    module /boot/setup.tar setup
    set gfxpayload=1024x768x32,1024x768,auto
    boot
}

# The boot messages instead of the startup screen.
menuentry "Install fluxOS (show boot messages)" {
    multiboot /boot/fluxos.kernel bootfs=iso9660 nosplash
    module /boot/setup.tar setup
    set gfxpayload=1024x768x32,1024x768,auto
    boot
}

# Setup asks its questions on the text console (fluxinstall's guided mode).
menuentry "Install fluxOS (text mode)" {
    multiboot /boot/fluxos.kernel bootfs=iso9660
    module /boot/setup.tar setup
    set gfxpayload=text
    boot
}

# For hardware that upsets the drivers: one processor, the BIOS's display
# mode without a card's own driver, no write-combining.
menuentry "Install fluxOS (safe mode)" {
    multiboot /boot/fluxos.kernel bootfs=iso9660 nosmp radeon=off voodoo=off pat=off nosplash
    module /boot/setup.tar setup
    set gfxpayload=1024x768,auto
    boot
}

menuentry "Start fluxOS from the hard disk" --id harddisk {
    set root=(hd0)
    chainloader +1
    boot
}
