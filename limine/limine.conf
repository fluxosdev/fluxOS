# The boot menu of a disk fluxOS is installed on (Limine's:
# /boot/limine/limine.conf on the partition the kernel is on, which
# fluxinstall writes from this, with the first line filled in). The
# system runs from the disk: the kernel mounts the volume with the UUID
# named in ROOT (an ext2 one's, or a FAT32 one's serial number) as / and no
# initrd is loaded.
${ROOT}=@ROOT@

# Display settings, which Display Properties rewrites (these two lines, as
# they are: a name, "=", the value). GFX is the mode Limine asks the
# firmware for; VIDEO, when set, is a mode for a 3dfx card's own driver
# (video= on the kernel command line). By default the firmware's mode
# nearest GFX stays.
${GFX}=1024x768x32
${VIDEO}=

timeout: 3
default_entry: 1
interface_branding: fluxOS
interface_help_hidden: yes

/fluxOS
    protocol: limine
    path: boot():/boot/fluxos.kernel
    cmdline: ${ROOT} video=${VIDEO}
    resolution: ${GFX}

# The boot messages instead of the startup screen.
/fluxOS (show boot messages)
    protocol: limine
    path: boot():/boot/fluxos.kernel
    cmdline: ${ROOT} video=${VIDEO} nosplash
    resolution: ${GFX}

# A BIOS's text mode (UEFI firmware has none).
/fluxOS (text console)
    protocol: limine
    path: boot():/boot/fluxos.kernel
    cmdline: ${ROOT}
    textmode: yes

# Safe mode, for when a driver or a display setting stops fluxOS from
# starting: one processor, the firmware's display mode without a card's own
# driver, no write-combining, and the boot messages shown.
/fluxOS (safe mode)
    protocol: limine
    path: boot():/boot/fluxos.kernel
    cmdline: ${ROOT} nosmp radeon=off intelgfx=off voodoo=off pat=off nosplash
    resolution: 1024x768x32
