# The install CD's menu (Limine's: /boot/limine/limine.conf there). It
# starts fluxOS Setup: the kernel with a small setup system in memory
# (setup.tar), which installs the system on the CD (system.tar) onto a hard
# disk. The installed disk has its own menu (limine.conf here), which
# fluxinstall writes there.
timeout: 5
default_entry: 1
interface_branding: fluxOS
interface_help_hidden: yes

/Install fluxOS
    protocol: limine
    path: boot():/boot/fluxos.kernel
    cmdline: bootfs=iso9660
    module_path: boot():/boot/setup.tar
    resolution: 1024x768x32

# The boot messages instead of the startup screen.
/Install fluxOS (show boot messages)
    protocol: limine
    path: boot():/boot/fluxos.kernel
    cmdline: bootfs=iso9660 nosplash
    module_path: boot():/boot/setup.tar
    resolution: 1024x768x32

# Setup asks its questions on the text console (fluxinstall's guided mode).
# A BIOS's text mode: UEFI firmware has none, and shows the graphical Setup.
/Install fluxOS (text mode)
    protocol: limine
    path: boot():/boot/fluxos.kernel
    cmdline: bootfs=iso9660
    module_path: boot():/boot/setup.tar
    textmode: yes

# For hardware that upsets the drivers: one processor, the firmware's
# display mode without a card's own driver, no write-combining.
/Install fluxOS (safe mode)
    protocol: limine
    path: boot():/boot/fluxos.kernel
    cmdline: bootfs=iso9660 nosmp radeon=off intelgfx=off voodoo=off pat=off nosplash
    module_path: boot():/boot/setup.tar
    resolution: 1024x768x32

# The CD may well still be in the drive when Setup restarts the computer.
/Start fluxOS from the hard disk
    protocol: chainload
    drive: 1
